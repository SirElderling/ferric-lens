[package]
name = "ferric-lens"
version = "0.1.0"
edition = "2021"
description = "Deterministic, zero-configuration structural analysis for Rust codebases"
license = "MIT"
repository = "https://github.com/SirElderling/ferric-lens"

[dependencies]
blake3 = "1.5"
clap = { version = "4.5", features = ["derive"] }
quote = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
syn = { version = "2.0", features = ["full", "visit"] }
