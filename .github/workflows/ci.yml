name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.os }} / stable
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --all

      - name: Upload formatted source
        uses: actions/upload-artifact@v4
        with:
          name: ferric-lens-formatted-src
          path: src

      - name: Commit formatting
        if: runner.os == 'Linux'
        run: |
          if ! git diff --quiet -- src; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src
            git commit -m "style: apply rustfmt to split test modules"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Verify formatting
        run: git diff --exit-code

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all-targets --all-features

      - name: Install coverage tooling
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Measure coverage
        if: runner.os == 'Linux'
        run: cargo llvm-cov --all-targets --all-features --lcov --output-path target/coverage.lcov

      - name: Upload coverage evidence
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ferric-lens-coverage
          path: target/coverage.lcov

      - name: Enforce 100% coverage
        if: runner.os == 'Linux'
        run: cargo llvm-cov report --show-missing-lines --fail-under-lines 100 --fail-under-regions 100 --fail-under-functions 100

      - name: End-to-end check
        run: cargo run --locked -- check . --base origin/main --json target/ferric-lens-self-check.json

      - name: Release build
        run: cargo build --release --locked
